<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Smart TV Real</title>
    <style>
        body {
            background: #14141f; color: white;
            font-family: Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .config-panel {
            background: #222; padding: 15px; border-radius: 10px; margin-bottom: 20px; width: 300px;
        }
        .config-panel input {
            width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: none;
        }
        .remote {
            background: #282830; padding: 20px; border-radius: 30px; width: 300px;
            display: flex; flex-direction: column; gap: 15px; align-items: center;
        }
        .row { display: flex; gap: 15px; justify-content: center; width: 100%; }
        button {
            background: #333; color: white; border: none; padding: 15px; border-radius: 10px;
            cursor: pointer; font-weight: bold; width: 60px;
        }
        button:active { background: #555; }
        .btn-power { background: #d9534f; border-radius: 50%; width: 50px; height: 50px; }
        #status { margin-top: 15px; color: #00ffcc; font-size: 14px; text-align: center;}
    </style>
</head>
<body>

    <div class="config-panel">
        <label>IP de la Smart TV (Ej: 192.168.1.50):</label>
        <input type="text" id="tv-ip" placeholder="192.168.1.X" value="192.168.1.100">
    </div>

    <div class="remote">
        <div class="row">
            <button class="btn-power" onclick="sendCommand('Power')">⏻</button>
            <button onclick="sendCommand('Home')">🏠</button>
        </div>
        
        <div class="row" style="flex-direction: column; align-items: center; background: #1a1a20; padding: 15px; border-radius: 50%;">
            <button onclick="sendCommand('Up')">▲</button>
            <div class="row">
                <button onclick="sendCommand('Left')">◀</button>
                <button onclick="sendCommand('Select')" style="background:#444;">OK</button>
                <button onclick="sendCommand('Right')">▶</button>
            </div>
            <button onclick="sendCommand('Down')">▼</button>
        </div>

        <div class="row">
            <button onclick="sendCommand('VolumeDown')">Vol -</button>
            <button onclick="sendCommand('VolumeMute')">Mute</button>
            <button onclick="sendCommand('VolumeUp')">Vol +</button>
        </div>
        
        <div id="status">Esperando comando...</div>
    </div>

    <script>
        // Función real que se comunica con la API de la TV en la red local
        async function sendCommand(key) {
            const ip = document.getElementById('tv-ip').value;
            const statusDisplay = document.getElementById('status');
            
            if (!ip) {
                statusDisplay.style.color = '#ff4d4d';
                statusDisplay.textContent = 'Error: Ingresa la IP de la TV';
                return;
            }

            statusDisplay.style.color = '#fff';
            statusDisplay.textContent = `Enviando '${key}'...`;

            // Esta URL es el estándar para TVs con sistema Roku
            // Para otras marcas (LG, Samsung), la URL y el método (fetch/websocket) cambia drásticamente.
            const url = `http://${ip}:8060/keypress/${key}`;

            try {
                // Se envía la petición por la red Wi-Fi
                const response = await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors' // Necesario para evitar bloqueos del navegador en redes locales
                });
                
                statusDisplay.style.color = '#00ffcc';
                statusDisplay.textContent = `Comando '${key}' enviado con éxito`;
                
            } catch (error) {
                console.error('Error de conexión:', error);
                statusDisplay.style.color = '#ff4d4d';
                statusDisplay.textContent = 'Error: No se pudo conectar a la TV';
            }
        }
    </script>
</body>
</html>
