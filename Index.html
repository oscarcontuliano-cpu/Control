<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Remoto Virtual</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Pantalla de estado */
        .screen {
            background-color: #111;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 12px 20px;
            width: 300px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .screen h3 {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status-display {
            font-size: 16px;
            color: #00ffcc;
            font-weight: bold;
            min-height: 24px;
        }

        /* Diseño del Control Remoto */
        .remote {
            background: linear-gradient(145deg, #2b2b2b, #1f1f1f);
            border-radius: 35px;
            padding: 25px 20px;
            width: 280px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid #444;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Estilo general de los botones */
        button {
            background: #333;
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 3px rgba(255,255,255,0.1);
            outline: none;
        }

        button:active {
            transform: scale(0.92);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3), inset 0 1px 1px rgba(0,0,0,0.5);
            background: #222;
        }

        /* Botón de Encendido (Power) */
        .btn-power {
            background: #d9534f;
            color: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-weight: bold;
        }
        .btn-power:active {
            background: #b52b27;
        }

        /* Botones redondos pequeños / medianos */
        .btn-round {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #3a3a3a;
        }

        /* Pad de Navegación Direccional (D-Pad) */
        .d-pad-container {
            position: relative;
            width: 160px;
            height: 160px;
            background: #252525;
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .d-btn {
            position: absolute;
            background: #383838;
            border: none;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .d-btn:active {
            background: #555;
        }

        .btn-up { top: 5px; left: 50%; transform: translateX(-50%); width: 50px; height: 40px; border-radius: 25px 25px 5px 5px; }
        .btn-down { bottom: 5px; left: 50%; transform: translateX(-50%); width: 50px; height: 40px; border-radius: 5px 5px 25px 25px; }
        .btn-left { left: 5px; top: 50%; transform: translateY(-50%); width: 40px; height: 50px; border-radius: 25px 5px 5px 25px; }
        .btn-right { right: 5px; top: 50%; transform: translateY(-50%); width: 40px; height: 50px; border-radius: 5px 25px 25px 5px; }
        
        .btn-ok {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #444;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            z-index: 2;
        }

        /* Botones alargados / rectangulares (Volumen / Canal) */
        .btn-bar {
            width: 60px;
            height: 35px;
            border-radius: 8px;
            background: #383838;
            font-size: 13px;
            font-weight: bold;
        }

        /* Accesos directos a Apps */
        .app-buttons {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-app {
            flex: 1;
            border-radius: 6px;
            height: 32px;
            font-size: 11px;
            font-weight: bold;
            background: #333;
        }
        
        .btn-netflix { color: #e50914; }
        .btn-prime { color: #00a8e1; }
        .btn-youtube { color: #ff0000; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Estado -->
        <div class="screen">
            <h3>Estado del Sistema</h3>
            <div id="status-display">Control listo</div>
        </div>

        <!-- Cuerpo del Control Remoto -->
        <div class="remote">
            
            <!-- Fila Superior: Power y Mute -->
            <div class="row">
                <button class="btn-power" onclick="pressButton('Power (Encendido/Apagado)')">⏻</button>
                <button class="btn-round" onclick="pressButton('Ajustes')">⚙</button>
                <button class="btn-round" onclick="pressButton('Silenciar (Mute)')">🔇</button>
            </div>

            <!-- Accesos directos de Apps -->
            <div class="app-buttons">
                <button class="btn-app btn-netflix" onclick="pressButton('Netflix')">NETFLIX</button>
                <button class="btn-app btn-prime" onclick="pressButton('Prime Video')">PRIME</button>
                <button class="btn-app btn-youtube" onclick="pressButton('YouTube')">YOUTUBE</button>
            </div>

            <!-- Panel Direccional (D-Pad) -->
            <div class="d-pad-container">
                <button class="d-btn btn-up" onclick="pressButton('Arriba')">▲</button>
                <button class="d-btn btn-left" onclick="pressButton('Izquierda')">◀</button>
                <button class="d-btn btn-right" onclick="pressButton('Derecha')">▶</button>
                <button class="d-btn btn-down" onclick="pressButton('Abajo')">▼</button>
                <button class="btn-ok" onclick="pressButton('OK / Seleccionar')">OK</button>
            </div>

            <!-- Fila de Volúmenes y Canales -->
            <div class="row">
                <div style="display: flex; flex-direction: column; gap: 5px; align-items: center;">
                    <span style="font-size: 10px; color: #aaa;">VOL</span>
                    <button class="btn-bar" onclick="pressButton('Volumen +')">＋</button>
                    <button class="btn-bar" onclick="pressButton('Volumen -')">－</button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px; align-items: center;">
                    <span style="font-size: 10px; color: #aaa;">CH</span>
                    <button class="btn-bar" onclick="pressButton('Canal Arriba')">CH ∧</button>
                    <button class="btn-bar" onclick="pressButton('Canal Abajo')">CH ∨</button>
                </div>
            </div>

            <!-- Botones multimedia inferiores -->
            <div class="row">
                <button class="btn-round" onclick="pressButton('Retroceder')">⏮</button>
                <button class="btn-round" onclick="pressButton('Reproducir / Pausa')">⏯</button>
                <button class="btn-round" onclick="pressButton('Avanzar')">⏭</button>
                <button class="btn-round" onclick="pressButton('Home / Inicio')">🏠</button>
            </div>

        </div>
    </div>

    <script>
        function pressButton(actionName) {
            const display = document.getElementById('status-display');
            display.textContent = `Acción: ${actionName}`;
            
            // Efecto sutil de parpadeo en el texto
            display.style.opacity = '0.4';
            setTimeout(() => {
                display.style.opacity = '1';
            }, 150);
        }
    </script>
</body>
</html>
